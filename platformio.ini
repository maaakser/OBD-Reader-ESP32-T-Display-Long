;OBD_skaner - do T-Display-S3-Long + adapter OBD-II BLE (Veepeak) wersja ALPHA (test z telefonem)

[platformio]
default_envs = obd_skaner
boards_dir = ./board

[env:obd_skaner]
platform = espressif32 @6.5.0
board = T-Display-Long
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200

build_flags =
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
